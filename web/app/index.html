<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f1ec" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Inmuebles en Ruta</title>
</head>
<body class="view-home">
  <div id="map"></div>

  <main id="home" class="home">
    <header class="home-head">
      <button id="avatar" class="avatar" aria-label="Cambiar nombre">A</button>
      <div class="greet"><small id="greet-time">Hola</small><h1 id="greet-name">Hola</h1></div>
      <button id="bell2" class="roundbtn" aria-label="Alertas de cercanía"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
    </header>
    <label class="search home-search">
      <span class="search-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <input id="hq" type="search" placeholder="Busca casas, edificios, fincas…" autocomplete="off" enterkeyhint="search" />
    </label>
    <div class="seg" id="hchips"></div>
    <section id="featured"></section>
    <div class="sec-head"><h2>Mejores inmuebles cerca de ti</h2><small id="hcount"></small></div>
    <div id="hlist"></div>
  </main>

  <div id="gps-banner" class="hidden"></div>

  <header class="hud" id="hud">
    <label class="search">
      <span class="search-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
      <input id="q" type="search" placeholder="Buscar casa, calle o precio…" autocomplete="off" enterkeyhint="search" />
      <button id="bell" class="bell" type="button" aria-label="Alertas de cercanía"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg></button>
    </label>
    <div id="results" class="results hidden"></div>
    <div class="counters">
      <div class="chips" id="chips"></div>
      <div class="total"><div id="total">0</div><span class="pill sun">Total</span></div>
    </div>
  </header>

  <div class="mapctl" id="mapctl">
    <button id="recenter" class="hidden" aria-label="Centrar en mi ubicación"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8z"/></svg></button>
    <button id="zin" aria-label="Acercar">+</button>
    <button id="zout" aria-label="Alejar">−</button>
  </div>

  <button id="compass" aria-label="Cambiar vista 2D/3D"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2 17 13H7z" fill="#e5484d"/><path d="M12 22 7 13h10z" fill="#9a978f"/></svg></button>
  <div id="street" class="hidden"></div>
  <div id="navbar" class="hidden"></div>
  <div id="speed" class="hidden"><b>0</b><small>km/h</small></div>
  <div id="routepanel" class="hidden"></div>
  <div id="toast" class="hidden" role="status"></div>
  <aside id="alertpanel" class="sheet"></aside>
  <aside id="sheet" aria-live="polite"></aside>
  <nav id="tabbar" aria-label="Vista">
    <button data-view="home" class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Inicio</span></button>
    <button data-view="map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4-6 2v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/></svg><span>Mapa</span></button>
  </nav>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
