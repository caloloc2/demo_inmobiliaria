<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <title>Inmuebles en Ruta</title>
</head>
<body>
  <div id="map"></div>
  <div id="gps-banner" class="hidden"></div>
  <div class="topbar">
    <div id="count">Buscando inmuebles…</div>
    <div class="chips">
      <button class="chip" data-type="casa" style="--c:#22c55e">🏠 Casas</button>
      <button class="chip" data-type="edificio" style="--c:#3b82f6">🏢 Edificios</button>
      <button class="chip" data-type="finca" style="--c:#f59e0b">🌳 Fincas</button>
    </div>
  </div>
  <button id="recenter" class="hidden" aria-label="Centrar en mi ubicación">◎</button>
  <aside id="sheet" aria-live="polite"></aside>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
